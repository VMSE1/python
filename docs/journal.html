<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Журнал</title><link rel="stylesheet" href="site.css"></head><body>
<main class="wrap">
<div class="crumbs">Журнал</div><h1>Журнал сдачи</h1>
<p class="m">Кто какие задания сдал. Данные берутся из заявок на GitHub: ✅ — решено, ❌ — есть ошибки, пусто — не сдавал.</p>
<div class="btns"><button class="btn alt" id="csv">Скачать CSV</button><a class="btn ghost" id="all" target="_blank" rel="noopener">Все заявки на GitHub</a></div>
<div id="out" class="box">Загружаю…</div>
</main>
<script src="site.js"></script><script src="data/tasks.js"></script>
<script>
layout("journal.html","Журнал");
document.getElementById("all").href=ghUrl("/issues?q=label%3A%D1%81%D0%B4%D0%B0%D1%87%D0%B0");
var rows=[];
fetchIssues("сдача",function(a){
 var by={};
 a.forEach(function(x){var s=sections(x.body),nick=(s["Ник"]||"?").toLowerCase(),tm=(s["Задание"]||"").match(/^(\d+\.\d+)/);if(!tm)return;
  var labels=x.labels.map(function(l){return l.name}),st=labels.indexOf("решено")>=0?"ok":(labels.indexOf("ошибки")>=0?"bad":"wait");
  by[nick]=by[nick]||{};var cur=by[nick][tm[1]];if(!cur||st==="ok"||(cur!=="ok"&&st!=="wait"))by[nick][tm[1]]=st});
 var nicks=Object.keys(by).sort();
 if(!nicks.length){document.getElementById("out").innerHTML="Пока нет сдач.";return}
 var h='<div style="overflow:auto"><table class="matrix"><tr><th>Ник</th>'+TASKS.map(function(t){return '<th title="'+esc(t.title)+'">'+t.id+'</th>'}).join("")+'<th>Решено</th></tr>';
 nicks.forEach(function(n){var c=0,r=[n];h+='<tr><td>'+esc(n)+'</td>'+TASKS.map(function(t){var v=by[n][t.id];if(v==="ok")c++;r.push(v==="ok"?"1":(v==="bad"?"0":""));return '<td>'+(v==="ok"?'<span class="ok">✅</span>':v==="bad"?'<span class="bad">❌</span>':v==="wait"?"…":"")+'</td>'}).join("")+'<td><b>'+c+'</b> / '+TASKS.length+'</td></tr>';r.push(c);rows.push(r)});
 document.getElementById("out").innerHTML=h+'</table></div>';
},function(e){document.getElementById("out").innerHTML='<span class="bad">Не удалось загрузить ('+esc(e.message)+'). GitHub недоступен или превышен лимит запросов (60 в час с одного адреса).</span>'});
document.getElementById("csv").onclick=function(){var c="﻿ник;"+TASKS.map(function(t){return t.id}).join(";")+";решено\n"+rows.map(function(r){return r.join(";")}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="journal.csv";a.click()};
</script></body></html>
