<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://api.github.com https://vsemcode.ru wss://vsemcode.ru; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'"><meta name="referrer" content="no-referrer"><title>Мой профиль</title><link rel="preload" href="fonts/press-start-2p-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/ibm-plex-mono-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="live.css"></head><body>
<main class="wrap">
<div class="crumbs">Мой профиль</div><h1>Мой профиль</h1>
<div id="app"></div>
</main>
<script src="site.js"></script><script src="data/tasks.js?v=2810"></script><script src="config.js"></script><script src="net.js"></script><script src="hero.js"></script>
<script>
layout("account.html","Мой профиль");
var app=document.getElementById("app"),mode="in";
function $(i){return document.getElementById(i)}
function ls(k){try{var v=JSON.parse(localStorage.getItem(k)||"{}");return v&&typeof v==="object"?v:{}}catch(e){return {}}}
function field(id,label,type,val,hint,ac){return '<div class="fld"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(val||"")+'" autocomplete="'+(ac||"off")+'" autocapitalize="off" spellcheck="false">'+(hint?'<div class="hint">'+hint+'</div>':"")+'</div>'}
function loggedOut(){
 var nick="",fio="",grp="";try{nick=localStorage.getItem("nick")||"";fio=localStorage.getItem("fio")||"";grp=localStorage.getItem("group")||""}catch(e){}
 var h='<div class="howto"><span><b>Зачем профиль.</b> Прогресс сохраняется на сервере: войдёшь с другого телефона или компьютера, и все задания на месте. GitHub для этого не нужен.</span></div>'+
 '<div class="seg" role="tablist"><button type="button" role="tab" id="tIn" class="'+(mode==="in"?"on":"")+'" aria-selected="'+(mode==="in")+'">Войти</button><button type="button" role="tab" id="tUp" class="'+(mode==="up"?"on":"")+'" aria-selected="'+(mode==="up")+'">Создать профиль</button></div>'+
 '<form class="box acf" id="f" novalidate>'+
 (mode==="up"?'<p class="m">Придумай ник (его увидят одноклассники в играх) и пароль. Фамилию и имя видит только учитель.</p>':'<p class="m">Введи ник и пароль, которые указал при создании профиля.</p>')+
 field("nk","Ник (псевдоним)","text",nick,mode==="up"?"3–20 символов: буквы, цифры, точка, дефис":"","username")+
 (mode==="up"?field("em","Почта","email","","Нужна, чтобы вернуть пароль, если забудешь","email"):"")+(mode==="up"?field("fo","Фамилия и имя","text",fio,"Например: Иванова Аня. Нужно, чтобы учитель понял, кто это","name")+field("gr","Группа","text",grp,"Например 9А. Нет группы: напиши «нет»","off"):"")+
 field("pw","Пароль","password","",mode==="up"?"Минимум 6 символов. Не используй пароль от почты или соцсетей":"",mode==="up"?"new-password":"current-password")+
 (mode==="up"?field("p2","Повтори пароль","password","","","new-password"):"")+
 '<label class="chk"><input type="checkbox" id="sh"> Показать пароль</label>'+
 '<div class="bad" id="er" role="alert"></div>'+
 '<button class="btn big go" type="submit" id="go">'+(mode==="up"?"Создать профиль":"Войти")+'</button></form>'+
 '<p class="m" style="font-size:14px">Забыл пароль? Скажи учителю: он задаст новый.</p>';
 app.innerHTML=h;
 $("tIn").onclick=function(){mode="in";loggedOut()};$("tUp").onclick=function(){mode="up";loggedOut()};
 $("sh").onchange=function(){["pw","p2"].forEach(function(i){if($(i))$(i).type=$("sh").checked?"text":"password"})};
 $("f").onsubmit=function(e){e.preventDefault();submit()};
}
function submit(){
 var er=$("er"),nick=$("nk").value.trim(),pw=$("pw").value;er.textContent="";
 if(!nick||!pw){er.textContent="Впиши ник и пароль.";return}
 var o={nick:nick,password:pw};
 if(mode==="up"){
  if(pw!==$("p2").value){er.textContent="Пароли не совпадают.";$("p2").focus();return}
  o.email=$("em").value.trim();o.fio=$("fo").value;o.group=$("gr").value}
 var b=$("go");b.disabled=true;b.textContent="Подожди…";
 Net[mode==="up"?"register":"login"](o).then(function(j){
  if(j.ok){loggedIn("Готово! Ты вошёл.");try{localStorage.setItem("pickSubj","1")}catch(e){}if(window.askSubject)askSubject();return}
  er.textContent=j.error||"Не получилось. Попробуй ещё раз.";b.disabled=false;b.textContent=mode==="up"?"Создать профиль":"Войти"
 }).catch(function(e){er.textContent=e.message;b.disabled=false;b.textContent=mode==="up"?"Создать профиль":"Войти"});
}
function loggedIn(msg){
 var u=Net.user();if(!u){loggedOut();return}
 var done=ls("done"),pa=ls("passed"),n=TASKS.filter(function(t){return pa[t.id]||done[t.id]}).length,p=Math.round(n/TASKS.length*100);
 app.innerHTML=(msg?'<div class="okb" role="status">'+esc(msg)+'</div>':"")+
 '<div class="box prof"><div class="pn">'+esc(u.nick)+'</div><div class="m">'+esc(u.fio||"")+(u.group?" · группа "+esc(u.group):"")+'</div>'+
 '<div class="pbar" role="img" aria-label="Выполнено '+n+' из '+TASKS.length+'"><i style="width:'+p+'%"></i></div><div class="m">Выполнено заданий: <b>'+n+' из '+TASKS.length+'</b></div>'+
 '<div class="btns"><a class="btn big go" href="tasks.html">К заданиям</a><button class="btn" id="sy" type="button">Обновить с сервера</button><button class="btn ghost" id="lo" type="button">Выйти</button></div><div class="m" id="sm" role="status"></div></div>'+
 '<p class="m" style="font-size:14px">Прогресс сохраняется сам, когда ты решаешь задания. На другом устройстве просто войди с этим ником.</p>';
 heroBox();
 $("sy").onclick=function(){$("sm").textContent="Обновляю…";Net.sync().then(function(j){if(j&&j.ok)loggedIn("Прогресс обновлён.");else $("sm").textContent="Не удалось связаться с сервером."})};
 $("lo").onclick=function(){Net.logout().then(function(){mode="in";loggedOut()})};
}

/* Мой персонаж: немного настроек, сохраняется на сервере */
var myLook=null;
function heroPaint(){var cv=$("hcv");if(!cv)return;var c=cv.getContext("2d");c.clearRect(0,0,cv.width,cv.height);c.fillStyle="#fffbdc";c.fillRect(0,0,cv.width,cv.height);Hero.draw(c,myLook,0,0,6)}
function heroBox(){
 var host=document.createElement("div");host.className="box";host.id="hero";host.innerHTML='<div class="pn" style="font-size:13px">Мой персонаж</div><div class="m">Собери себя. Персонажа увидит только твой профиль.</div><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:10px"><canvas id="hcv" width="144" height="162" style="width:144px;height:162px;border:3px solid #1a0f4d;image-rendering:pixelated;background:#fffbdc"></canvas><div id="hopt" style="flex:1;min-width:220px"></div></div><div class="btns" style="margin-top:10px"><button class="btn go" id="hsv" type="button">Сохранить персонажа</button></div><div class="m" id="hms" role="status"></div>';
 app.appendChild(host);
 function opts(){var h="";["skin","hair","style","shirt","glasses","tie"].forEach(function(k){
  var mx=Hero.max[k],cells="";for(var i=0;i<=mx;i++){var on=myLook[k]===i,sw=Hero.swatch[k]&&Hero.swatch[k][i];
   var label=k==="style"?Hero.styleNames[i]:k==="glasses"?(i?"Есть":"Нет"):k==="tie"?(i?"№"+i:"Нет"):"";
   cells+='<button type="button" data-k="'+k+'" data-i="'+i+'" aria-pressed="'+on+'" aria-label="'+Hero.names[k]+' '+(i+1)+'" style="min-width:34px;height:34px;margin:2px;padding:0 6px;border:3px solid '+(on?"#d03030":"#1a0f4d")+';background:'+(sw||"#fffbdc")+';font:500 12px var(--mono);cursor:pointer;color:#1a0f4d">'+label+'</button>'}
  h+='<div style="margin:4px 0"><div class="m" style="font-size:13px;margin:0">'+Hero.names[k]+'</div>'+cells+'</div>'});
  $("hopt").innerHTML=h;
  $("hopt").querySelectorAll("button").forEach(function(b){b.onclick=function(){myLook[b.dataset.k]=+b.dataset.i;$("hms").textContent="";opts();heroPaint()}})}
 myLook=Hero.clean(null);opts();heroPaint();
 Net.req("GET","/api/look").then(function(j){if(j&&j.ok){myLook=Hero.clean(j.look);opts();heroPaint()}}).catch(function(){});
 $("hsv").onclick=function(){var m=$("hms");m.textContent="Сохраняю…";Net.req("POST","/api/look",myLook).then(function(j){m.textContent=j&&j.ok?"Персонаж сохранён.":((j&&j.error)||"Не получилось")}).catch(function(e){m.textContent=e.message})}
}
if(!Net.on)app.innerHTML='<div class="box"><p>Сервер пока не подключён. Пока что решай задания как раньше: прогресс хранится в этом браузере.</p></div>';
else if(Net.user()){loggedIn();Net.sync().then(function(j){if(j&&j.ok)loggedIn()})}
else loggedOut();
</script></body></html>
