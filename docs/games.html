<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'"><meta name="referrer" content="no-referrer"><title>Игры</title><link rel="preload" href="fonts/press-start-2p-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/ibm-plex-mono-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="games.css"></head><body>
<main class="wrap">
<div class="crumbs">Игры</div><h1>Мини-игры</h1>
<p class="m">Награда за пройденные задания. Играть можно когда угодно. Они на минутку: потом возвращайся к заданиям.</p>
<div class="tabs" id="gt"></div><div id="gh" style="margin-top:20px"></div>
</main>
<script src="site.js"></script><script src="games.js"></script>
<script>
layout("games.html","Игры");
var cur=null,inst=null,q=new URLSearchParams(location.search).get("g");
function pick(id){if(inst)inst.destroy();cur=id;inst=Games.mount(document.getElementById("gh"),id);
 Array.prototype.forEach.call(document.querySelectorAll("#gt button"),function(b){b.className=b.dataset.g===id?"on":""});
 try{history.replaceState(null,"","?g="+id)}catch(e){}}
document.getElementById("gt").innerHTML=Games.LIST.map(function(g){return '<button data-g="'+g.id+'">'+esc(g.name)+'</button>'}).join("");
Array.prototype.forEach.call(document.querySelectorAll("#gt button"),function(b){b.onclick=function(){pick(b.dataset.g)}});
pick(Games.byId(q)?q:Games.LIST[0].id);
</script></body></html>
