<script src="site.js"></script><script src="config.js"></script><script src="net.js"></script><script src="honest.js"></script><script src="offline.js"></script><script src="runner/check.js"></script><script src="data/tasks.js"></script><script src="questions.js"></script>
<script>
layout("teacher.html","Кабинет");
var OWNER=CFG.repo.split("/")[0],app=document.getElementById("app"),DATA=null;
function jget(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function ST(){try{return {tk:getToken(),login:localStorage.getItem("teacher")||""}}catch(e){return {tk:"",login:""}}}
function api(path,tk){return fetch("https://api.github.com"+path,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+tk}})}
function logout(){try{sessionStorage.removeItem("tk");localStorage.removeItem("tk");localStorage.removeItem("tkAt");localStorage.removeItem("teacher")}catch(e){}location.href="index.html"}

function srvKeyBox(msg){
 var fs='max-width:100%;margin:8px 0;width:100%;font:500 16px var(--mono);padding:10px;border:3px solid #000';
 return '<form class="box" id="tf" novalidate><b>Вход учителя</b><p class="m">Логин и пароль учителя. Здесь сдачи учеников, игра для всех, ученики, восстановление паролей.</p><label for="tl" class="m">Логин</label><input type="text" id="tl" autocomplete="username" autocapitalize="off" spellcheck="false" style="'+fs+'"><label for="tp" class="m">Пароль</label><input type="password" id="tp" autocomplete="current-password" style="'+fs+'"><p style="margin:12px 0 0"><button class="btn go" id="tin" type="submit">Войти</button></p></form>'+
 '<details class="box" style="margin-top:12px"><summary class="m">Войти по ключу сервера</summary><label for="sk" class="m">Ключ учителя</label><input type="password" id="sk" autocomplete="off" style="'+fs+'"><p style="margin:12px 0 0"><button class="btn" id="sin" type="button">Войти по ключу</button></p></details>'+
 '<p id="sm" class="'+(msg?'bad':'m')+'" role="alert" style="margin-top:10px">'+esc(msg||"")+'</p>'}
function gate(msg){
 app.innerHTML='<div class="gate"><div class="crumbs">Только для учителя</div><h1>Вход в кабинет</h1>'+(Net.on?srvKeyBox(msg):"")+
 '<details style="margin-top:14px"><summary class="m">Старый вход через GitHub (только если нужны заявки с GitHub)</summary>'+
 '<p class="m">Только для владельца репозитория (аккаунт <b style="color:var(--text)">'+esc(OWNER)+'</b>).</p>'+
 '<div class="box"><label for="tk">Токен</label><input type="text" id="tk" placeholder="ghp_…" style="max-width:100%;margin:8px 0" autocomplete="off" spellcheck="false">'+
 '<label class="m" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rem"> запомнить на этом компьютере</label>'+
 '<p style="margin:12px 0 0"><button class="btn" id="in">Войти</button></p><p id="gm" class="m" style="margin-top:10px"></p></div></details></div>';
 var tf=document.getElementById("tf");if(tf)tf.onsubmit=function(e){e.preventDefault();var l=document.getElementById("tl").value.trim(),p=document.getElementById("tp").value,m=document.getElementById("sm"),b=document.getElementById("tin");if(!l||!p){m.className="bad";m.textContent="Впиши логин и пароль.";return}
  m.className="m";m.textContent="Проверяю…";b.disabled=true;
  Net.req("POST","/api/teacher/login",{login:l,password:p}).then(function(j){b.disabled=false;if(j.ok&&j.token){Net.tkey(j.token);srvCabinet()}else{m.className="bad";m.textContent=j.error||"Неверный логин или пароль."}}).catch(function(x){b.disabled=false;m.className="bad";m.textContent=x.message})};
 var sin=document.getElementById("sin");if(sin)sin.onclick=function(){var k=document.getElementById("sk").value.trim(),m=document.getElementById("sm");if(!k)return;m.className="m";m.textContent="Проверяю…";
  Net.req("GET","/api/teacher/check",null,{"X-Teacher-Key":k}).then(function(j){if(j.ok){Net.tkey(k);srvCabinet()}else{m.className="bad";m.textContent="Ключ не подошёл."}}).catch(function(e){m.className="bad";m.textContent=e.message})};
 document.getElementById("in").onclick=function(){
  var tk=document.getElementById("tk").value.trim(),b=this;if(!tk){return}
  b.disabled=true;document.getElementById("gm").className="m";document.getElementById("gm").textContent="Проверяю…";
  api("/user",tk).then(function(r){if(!r.ok)throw new Error(r.status===401?"Токен не подошёл":"Ошибка GitHub "+r.status);return r.json()}).then(function(u){
   if(String(u.login).toLowerCase()!==OWNER.toLowerCase()){throw new Error("Этот аккаунт ("+u.login+") не владелец репозитория")}
   try{var rem=document.getElementById("rem").checked;(rem?localStorage:sessionStorage).setItem("tk",tk);if(rem)localStorage.setItem("tkAt",String(Date.now()));localStorage.setItem("teacher",u.login)}catch(e){}
   location.reload();
  }).catch(function(e){b.disabled=false;var g=document.getElementById("gm");g.className="bad";g.textContent=e.message||"Нет связи с GitHub"});
 };
}

var ISS=[];
function offRows(){return jget("offrows",[])}
function mergeOff(d){
 offRows().forEach(function(r){
  var k=r.n.toLowerCase(),u=d.by[k]=d.by[k]||{nick:r.n,t:{},fails:{},last:"",login:"",group:r.g==="нет"?"":r.g,warn:0,off:true};
  var st=r.ok?"ok":"bad",c=u.t[r.t];if(!c||st==="ok"||(c!=="ok"&&st!=="wait"))u.t[r.t]=st;
  if(st==="bad")u.fails[r.t]=(u.fails[r.t]||0)+1;
  var iso=r.ts?new Date(r.ts).toISOString():"";if(iso>u.last)u.last=iso;
  if(r.vl==="warn")u.warn++;
  d.sub.push({nick:r.n,task:r.t,st:st,url:"",date:iso||new Date().toISOString(),num:0,vd:{level:r.vl,reasons:r.vw||[]},off:true,msg:r.msg||""});
 });
 d.sub.sort(function(a,b){return a.date<b.date?1:-1});
 return d}
function statusOf(x){var l=x.labels.map(function(a){return a.name});return l.indexOf("решено")>=0?"ok":(l.indexOf("ошибки")>=0?"bad":"wait")}
function build(issues){
 var by={},sub=[];
 issues.forEach(function(x){var s=sections(x.body),nick=(s["Ник"]||"?").trim(),tm=(s["Задание"]||"").match(/^(\d+\.\d+)/);if(!tm)return;
  var st=statusOf(x),k=nick.toLowerCase();by[k]=by[k]||{nick:nick,t:{},fails:{},last:"",login:"",group:"",warn:0};if(x.user&&x.user.login)by[k].login=x.user.login;var gr=(s["Группа"]||"").trim();if(gr&&gr!=="_No response_")by[k].group=gr.slice(0,12);
  if(st==="bad")by[k].fails[tm[1]]=(by[k].fails[tm[1]]||0)+1;
  var c=by[k].t[tm[1]];if(!c||st==="ok"||(c!=="ok"&&st!=="wait"))by[k].t[tm[1]]=st;
  if(x.updated_at>by[k].last)by[k].last=x.updated_at;
  var cm=/^```[^\n]*\n([\s\S]*?)\n?```\s*$/.exec((s["Код решения"]||"").trim()),vd=Honest.verdict(Honest.parse(s["Служебное (не меняй)"]),cm?cm[1]:(s["Код решения"]||""));if(vd.level==="warn")by[k].warn++;
  sub.push({nick:nick,task:tm[1],st:st,url:x.html_url,date:x.updated_at,num:x.number,vd:vd})});
 return {by:by,sub:sub.sort(function(a,b){return b.date<a.date?-1:1})};
}
function cell(v){v=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csv(rows){return rows.map(function(r){return r.map(cell).join(";")}).join("\r\n")}
function qbest(){var q=jget("quizrows",[]),m={};q.forEach(function(r){var k=String(r.n).trim().toLowerCase(),p=Math.round(r.s/r.t*100);if(!m[k]||p>m[k])m[k]=p});return m}
function sheet(){
 var names=jget("names",{}),qb=qbest(),ns=Object.keys(DATA.by).sort(),head=["Ученик","Ник","Группа"].concat(TASKS.map(function(t){return t.id})).concat(["Решено","Всего заданий","Ошибочных попыток","Последняя активность","Тест, % (лучший)","Сдач с подозрением на вставку"]);
 var rows=[head];
 ns.forEach(function(k){var u=DATA.by[k],c=0,f=0;Object.keys(u.fails).forEach(function(i){f+=u.fails[i]});
  var cells=TASKS.map(function(t){var v=u.t[t.id];if(v==="ok")c++;return v==="ok"?"решено":(v==="bad"?"ошибки":(v==="wait"?"ждёт":""))});
  var q=qb[k];if(q==null&&names[k])q=qb[String(names[k]).toLowerCase()];
  rows.push([names[k]||(u.off?u.nick:""),u.nick,u.group||""].concat(cells).concat([c,TASKS.length,f,u.last?u.last.slice(0,16).replace("T"," "):"",q==null?"":q,u.warn]))});
 return rows}
function nm(nick){var n=jget("names",{})[nick.toLowerCase()];return n?esc(n)+' <span class="m">('+esc(nick)+')</span>':esc(nick)}
function dl(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:type||"text/csv"}));a.download=name;a.click()}
function cabinet(st){
 app.innerHTML='<div class="crumbs">Кабинет учителя · вы вошли как '+esc(st.login)+' · <a href="#" id="out">выйти</a></div><h1>Кабинет</h1><div class="cab-tabs" id="tb"></div><div id="tab"><span class="m">Загружаю данные…</span></div>';
 document.getElementById("out").onclick=function(e){e.preventDefault();logout()};
 var tabs=[["sum","Сводка"],["sub","Заявки"],["off","Без GitHub"],["stu","Ученики"],["game","Игра"],["quiz","Тест"],["lnk","Управление"]],cur="sum";
 function draw(){document.getElementById("tb").innerHTML=tabs.map(function(t){return '<button data-k="'+t[0]+'" class="'+(t[0]===cur?'on':'')+'">'+t[1]+'</button>'}).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#tb button"),function(b){b.onclick=function(){cur=b.dataset.k;draw();show()}});}
 function show(){var el=document.getElementById("tab");if(!DATA&&cur!=="quiz"&&cur!=="lnk"&&cur!=="off"&&cur!=="game"){el.innerHTML='<span class="m">Загружаю данные…</span>';return}({sum:tSum,sub:tSub,off:tOff,stu:tStu,quiz:tQuiz,lnk:tLnk,game:tGame})[cur](el)}
 draw();
 fetchIssues("сдача",function(a){ISS=a;DATA=mergeOff(build(a));show()},function(e){document.getElementById("tab").innerHTML='<div class="box bad">Не загрузилось ('+esc(e.message)+'). '+(e.message==="401"?'Токен устарел — <a href="#" id="o2">войти заново</a>.':'Проверь связь с GitHub.')+'</div>';var o=document.getElementById("o2");if(o)o.onclick=function(ev){ev.preventDefault();logout()}});
}
function tSum(el){
 var ns=Object.keys(DATA.by).sort(),solved=0,wait=0,stuck=[];
 ns.forEach(function(k){var u=DATA.by[k];TASKS.forEach(function(t){if(u.t[t.id]==="ok")solved++;if(u.t[t.id]==="wait")wait++;if(u.fails[t.id]>=3&&u.t[t.id]!=="ok")stuck.push(u.nick+" — "+t.id)})});
 var h='<div class="kpis"><div class="kpi"><b>'+ns.length+'</b><span>учеников (ников)</span></div><div class="kpi"><b>'+DATA.sub.length+'</b><span>заявок</span></div><div class="kpi"><b>'+solved+'</b><span>решённых заданий</span></div><div class="kpi"><b class="'+(stuck.length?'stuck':'')+'">'+stuck.length+'</b><span>застряли (3+ попыток)</span></div></div>';
 if(stuck.length)h+='<div class="callout warn" style="background:color-mix(in srgb,var(--amber) 9%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0"><b>Нужна помощь:</b> '+stuck.map(esc).join(", ")+'</div>';
 if(!ns.length){el.innerHTML=h+'<div class="box">Пока нет сдач.</div>';return}
 h+='<div class="box" style="overflow:auto"><table class="matrix"><tr><th>Ученик</th>'+TASKS.map(function(t){return '<th title="'+esc(t.title)+'">'+t.id+'</th>'}).join("")+'<th>Итого</th></tr>';
 ns.forEach(function(k){var u=DATA.by[k],c=0;h+='<tr><td>'+nm(u.nick)+(u.warn?' <span class="bad" title="Сдач с подозрением на вставку: '+u.warn+'. Подробности во вкладке «Заявки».">⚠</span>':'')+'</td>'+TASKS.map(function(t){var v=u.t[t.id];if(v==="ok")c++;return '<td>'+(v==="ok"?'<span class="ok">●</span>':v==="bad"?'<span class="bad">●</span>':v==="wait"?'<span class="m">○</span>':'')+'</td>'}).join("")+'<td><b>'+c+'</b>/'+TASKS.length+'</td></tr>'});
 h+='</table></div><p class="m" style="font-size:14px"><span class="ok">●</span> решено &nbsp; <span class="bad">●</span> ошибки &nbsp; <span>○</span> ждёт проверки</p><div class="btns"><button class="btn go" id="csv">Скачать ведомость (Excel)</button><button class="btn ghost" id="prn">Печать</button></div><p class="m" style="font-size:14px">Файл собирается у тебя в браузере и никуда не отправляется. Колонка «Ученик» берётся из вкладки «Ученики».</p>';
 el.innerHTML=h;
 document.getElementById("csv").onclick=function(){dl("ведомость_"+new Date().toISOString().slice(0,10)+".csv",csv(sheet()))};document.getElementById("prn").onclick=function(){window.print()};
}
function tSub(el){
 var em={ok:["решено","chip done"],bad:["ошибки","chip"],wait:["ждёт","chip"]};
 el.innerHTML='<div class="box"><table><tr><th>Ученик</th><th>Задание</th><th>Статус</th><th>Обновлено</th><th>Как набран код</th><th></th></tr>'+DATA.sub.slice(0,80).map(function(s){return '<tr><td>'+nm(s.nick)+'</td><td>'+s.task+'</td><td><span class="'+em[s.st][1]+'">'+em[s.st][0]+'</span></td><td class="m">'+new Date(s.date).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+'</td><td>'+(s.vd.level==="ok"?'<span class="ok">набран сам</span>':'<span class="'+(s.vd.level==="warn"?"bad":"m")+'" title="'+esc(s.vd.reasons.join("; "))+'">'+(s.vd.level==="warn"?"⚠ ":"")+esc(s.vd.reasons.join("; "))+'</span>')+'</td><td>'+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">открыть</a>':'<span class="m">без GitHub</span>')+'</td></tr>'}).join("")+'</table></div>';
}
function tOff(el){
 var rows=offRows();
 el.innerHTML='<p class="m">Ученики без GitHub присылают «код сдачи» (строка, начинающаяся с PYC1:) в мессенджер, на почту или файлом. Вставь коды сюда или загрузи файлы. Сайт сам перепроверит каждый код.</p>'+
 '<textarea class="code" id="oi" style="min-height:120px;border-radius:10px;width:100%" placeholder="Вставь коды сдачи, можно сразу много" aria-label="Коды сдачи"></textarea>'+
 '<div class="btns"><button class="btn go" id="og">Разобрать и проверить</button><label class="btn ghost" style="cursor:pointer">Загрузить файлы<input type="file" id="of" accept=".txt,text/plain" multiple hidden></label><button class="btn ghost" id="oc">Очистить список</button></div>'+
 '<p class="m" id="om" role="status"></p><div id="oo"></div>';
 function list(){var rs=offRows();document.getElementById("oo").innerHTML=rs.length?'<div class="box" style="overflow:auto"><table><tr><th>Ученик</th><th>Группа</th><th>Задание</th><th>Результат</th><th>Как набран код</th></tr>'+rs.slice().sort(function(a,b){return a.ts<b.ts?1:-1}).map(function(r){return '<tr><td>'+esc(r.n)+'</td><td class="m">'+esc(r.g)+'</td><td>'+esc(r.t)+'</td><td>'+(r.ok?'<span class="ok">решено</span>':'<span class="bad" title="'+esc(r.msg||"")+'">ошибки</span>')+'</td><td class="'+(r.vl==="warn"?"bad":"m")+'">'+(r.vl==="ok"?"набран сам":(r.vl==="warn"?"⚠ ":"")+esc((r.vw||[]).join("; ")))+'</td></tr>'}).join("")+'</table></div>':'<div class="box">Пока пусто.</div>'}
 list();
 function add(text){
  var toks=Offline.find(text),om=document.getElementById("om"),bad=0,items=[];
  toks.forEach(function(t){var o=Offline.unpack(t);if(!o||!o.valid)bad++;else items.push(o)});
  if(!toks.length){om.className="bad";om.textContent="Не нашёл ни одного кода (он начинается с PYC1:).";return}
  var i=0,ok=0;
  (function next(){
   if(i>=items.length){om.className=bad?"warn":"ok";om.textContent="Проверено: "+ok+" из "+toks.length+(bad?". Повреждённых кодов: "+bad+" (попроси прислать ещё раз).":".");list();DATA&&(DATA=mergeOff(build(ISS)));return}
   var o=items[i++],task=TASKS.filter(function(x){return x.id===o.t})[0];
   om.className="m";om.textContent="Проверяю "+i+" из "+items.length+(BrowserCheck.isReady()?"…":". Первый раз грузится проверка (около 13 МБ), подожди…");
   if(!task){bad++;next();return}
   BrowserCheck.run(task,o.c).then(function(r){
    var vd=Honest.verdict(Honest.parse(o.m),o.c),rs=offRows().filter(function(x){return !(x.n.toLowerCase()===o.n.toLowerCase()&&x.t===o.t&&x.ts===o.ts)});
    rs.push({n:o.n,g:o.g,t:o.t,ok:!!r.ok,ts:o.ts||Date.now(),vl:vd.level,vw:vd.reasons,msg:(r.messages||[]).join("; ").slice(0,200)});
    rs=rs.slice(-400);try{localStorage.setItem("offrows",JSON.stringify(rs))}catch(e){}
    ok++;next()});
  })();
 }
 document.getElementById("og").onclick=function(){add(document.getElementById("oi").value)};
 document.getElementById("of").onchange=function(){var fs=Array.prototype.slice.call(this.files||[]).slice(0,100),txt=[],n=0;if(!fs.length)return;fs.forEach(function(f){var r=new FileReader();r.onload=function(){txt.push(String(r.result).slice(0,200000));if(++n===fs.length)add(txt.join("\n"))};r.readAsText(f)})};
 document.getElementById("oc").onclick=function(){if(confirm("Убрать все проверенные коды без GitHub из списка?")){try{localStorage.removeItem("offrows")}catch(e){}if(DATA)DATA=build(ISS);tOff(el)}};
}
function tStu(el){
 var names=jget("names",{}),ks=Object.keys(DATA.by);Object.keys(names).forEach(function(k){if(ks.indexOf(k)<0)ks.push(k)});ks.sort();
 el.innerHTML='<p class="m">Здесь ты сопоставляешь ники с реальными именами. Это хранится <b style="color:var(--text)">только в этом браузере</b>, на GitHub и на сайт ничего не уходит. Сделай выгрузку, чтобы не потерять. Кнопка «students.csv для робота» готовит файл для приватного репозитория с ведомостью (BotBD): положи его туда вместо `students.csv`.</p>'+
 '<div class="box"><table><tr><th>Ник</th><th>GitHub</th><th>Группа</th><th>Фамилия Имя</th></tr>'+ks.map(function(k){var d=DATA.by[k]||{};return '<tr><td>'+esc(d.nick||k)+'</td><td class="m">'+esc(d.login||"")+'</td><td class="m">'+esc(d.group||"")+'</td><td><input type="text" data-k="'+esc(k)+'" value="'+esc(names[k]||"")+'" style="max-width:100%" aria-label="Имя для '+esc(k)+'"></td></tr>'}).join("")+'</table>'+
 '<div class="btns"><button class="btn" id="sv">Сохранить</button><button class="btn ghost" id="ex">Выгрузить файл</button><button class="btn go" id="stc">Выгрузить students.csv для робота</button><label class="btn ghost" style="cursor:pointer">Загрузить файл<input type="file" id="im" accept=".json" hidden></label></div><span id="sm" class="ok"></span></div>';
 document.getElementById("sv").onclick=function(){var o={};Array.prototype.forEach.call(el.querySelectorAll("input[data-k]"),function(i){if(i.value.trim())o[i.dataset.k]=i.value.trim()});try{localStorage.setItem("names",JSON.stringify(o))}catch(e){}document.getElementById("sm").textContent="Сохранено"};

  if(!rows.length){o.textContent="Пока никто ничего не сдал.";return}o.className="";
  o.innerHTML='<table><tr><th>Когда</th><th>Ученик</th><th>Группа</th><th>Задание</th><th>Итог</th><th>Метки защиты</th><th></th></tr>'+rows.map(function(r,i){return '<tr><td>'+ago2(r.ts)+'</td><td>'+esc(r.fio&&r.fio!==r.nick?r.fio+" ("+r.nick+")":r.nick)+'</td><td>'+esc(r.group)+'</td><td>'+esc(r.task)+'</td><td class="'+(r.status==="ok"?"ok":"bad")+'">'+(r.status==="ok"?"решено":"ошибки")+'</td><td>'+(r.flags.length?'<span class="warn">'+esc(r.flags.join(", "))+'</span>':'чисто')+'</td><td><button class="btn ghost" data-i="'+i+'" type="button">Код</button></td></tr>'}).join("")+'</table>';
  Array.prototype.forEach.call(o.querySelectorAll("button[data-i]"),function(b){b.onclick=function(){var r=rows[+b.dataset.i];Net.req("GET","/api/teacher/sub?id="+r.id,null,tkh()).then(function(c){var p=document.getElementById("sc");p.style.display="block";p.textContent=r.nick+" · "+r.task+"\n"+(r.msgs&&r.msgs.length?"Сообщения проверки: "+r.msgs.join(" | ")+"\n":"")+"----\n"+(c.code||"")})}})})}
 document.getElementById("rf").onclick=load;
 document.getElementById("cv").onclick=function(){dl("sdachi.csv",csv([["время","ник","фио","группа","задание","итог","метки"]].concat(rows.map(function(r){return [new Date(r.ts*1000).toISOString().slice(0,16).replace("T"," "),r.nick,r.fio,r.group,r.task,r.status,r.flags.join(", ")]}))))};
 load()}
function tRec(el){
 el.innerHTML='<div class="box"><p class="m" id="rm">Загружаю…</p><div id="ro"></div></div>';
 Net.req("GET","/api/teacher/recov",null,tkh()).then(function(j){var m=document.getElementById("rm");if(!m)return;if(!j.ok){m.className="bad";m.textContent=j.error||"Нет доступа";return}
  m.textContent=j.mailer?"Почта сервера настроена: ученику уходит письмо с кодом, тебе уведомление.":"Почта сервера не настроена: код письмом не уходит. Продиктуй ученику код из таблицы (он действует 30 минут).";
  document.getElementById("ro").innerHTML=j.rows.length?'<table><tr><th>Когда</th><th>Ученик</th><th>Почта</th><th>Код</th><th>Письмо</th></tr>'+j.rows.map(function(r){return '<tr><td>'+ago2(r.ts)+'</td><td>'+esc(r.fio&&r.fio!==r.nick?r.fio+" ("+r.nick+")":r.nick)+'</td><td>'+esc(r.email||"—")+'</td><td><b style="font-size:20px">'+(r.live?esc(r.code):"устарел")+'</b></td><td>'+(r.mailed?"отправлено":"нет")+'</td></tr>'}).join("")+'</table>':'<p>Запросов на восстановление пока нет.</p>'})}
function tQuiz(el){
 el.innerHTML='<p class="m">Вставь коды результатов теста, по одному в строке.</p><textarea class="code" id="qi" style="min-height:120px;border-radius:10px;width:100%" placeholder="Код 1&#10;Код 2"></textarea><div class="btns"><button class="btn" id="qg">Разобрать</button><button class="btn ghost" id="qc">Скачать CSV</button></div><div id="qo"></div>';
 var rows=[];
 function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}
 document.getElementById("qg").onclick=function(){rows=[];var bad=0,stat={};
  document.getElementById("qi").value.split(/\n+/).forEach(function(l){if(!l.trim())return;try{var o=dec(l),s=0;o.a.forEach(function(a){var q=QUESTIONS[a[0]];if(!q)return;stat[a[0]]=stat[a[0]]||[0,0];stat[a[0]][1]++;if(q.a==a[1]){s++;stat[a[0]][0]++}});rows.push({n:o.n,l:o.l,d:o.d,s:s,t:o.a.length})}catch(e){bad++}});
  rows.sort(function(a,b){return b.s/b.t-a.s/a.t});try{localStorage.setItem("quizrows",JSON.stringify(rows.map(function(r){return {n:String(r.n).slice(0,60),s:r.s,t:r.t,l:r.l,d:r.d}})))}catch(e){}
  var h='<div class="box"><table><tr><th>#</th><th>Ученик</th><th>Тест</th><th>Баллы</th><th>%</th></tr>'+rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+nm(r.n)+'</td><td>'+(r.l?'урок '+r.l:'весь курс')+'</td><td>'+r.s+' / '+r.t+'</td><td>'+Math.round(r.s/r.t*100)+'</td></tr>'}).join("")+'</table>'+(bad?'<p class="bad">Не прочитано кодов: '+bad+'</p>':'')+'</div>';
  var ids=Object.keys(stat).sort(function(a,b){return stat[a][0]/stat[a][1]-stat[b][0]/stat[b][1]});
  h+='<div class="box"><b>Самые трудные вопросы</b><table>'+ids.slice(0,6).map(function(i){return '<tr><td>'+stat[i][0]+' / '+stat[i][1]+'</td><td>урок '+QUESTIONS[i].l+': '+esc(QUESTIONS[i].q)+(QUESTIONS[i].code?'<pre>'+esc(QUESTIONS[i].code)+'</pre>':'')+'</td></tr>'}).join("")+'</table></div>';
  document.getElementById("qo").innerHTML=h};
 document.getElementById("qc").onclick=function(){dl("quiz.csv",csv([["имя","тест","баллы","всего","процент"]].concat(rows.map(function(r){return [r.n,r.l||"все",r.s,r.t,Math.round(r.s/r.t*100)]}))))};
}

if(Net.on&&Net.tkey()){Net.req("GET","/api/teacher/check",null,{"X-Teacher-Key":Net.tkey()}).then(function(j){if(j.ok)srvCabinet();else{try{sessionStorage.removeItem("tkey")}catch(e){}gate("Ключ не подошёл.")}}).catch(function(){gate()})}
else if(st.tk&&st.login&&st.login.toLowerCase()===OWNER.toLowerCase()){
