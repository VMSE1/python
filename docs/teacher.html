<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кабинет учителя</title><link rel="stylesheet" href="site.css"></head><body>
<main class="wrap" id="app"></main>
<script src="site.js"></script><script src="data/tasks.js"></script><script src="questions.js"></script>
<script>
layout("teacher.html","Кабинет");
var OWNER=CFG.repo.split("/")[0],app=document.getElementById("app"),DATA=null;
function jget(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function ST(){try{return {tk:getToken(),login:localStorage.getItem("teacher")||""}}catch(e){return {tk:"",login:""}}}
function api(path,tk){return fetch("https://api.github.com"+path,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+tk}})}
function logout(){try{sessionStorage.removeItem("tk");localStorage.removeItem("tk");localStorage.removeItem("teacher")}catch(e){}location.href="index.html"}

function gate(msg){
 app.innerHTML='<div class="gate"><div class="crumbs">Только для учителя</div><h1>Вход в кабинет</h1>'+
 '<p class="m">Кабинет откроется только владельцу репозитория — аккаунту <b style="color:var(--text)">'+esc(OWNER)+'</b>. Ученикам эта вкладка не показывается.</p>'+
 '<div class="box"><b>1.</b> Создай токен без прав: <a href="https://github.com/settings/tokens/new?description=python-course-teacher&amp;scopes=" target="_blank" rel="noopener">github.com/settings/tokens/new</a><br>'+
 '<span class="m">Срок — 90 дней, <b>ни одной галочки</b> в Select scopes, внизу Generate token.</span><br><br>'+
 '<b>2.</b> Скопируй токен (начинается с <code>ghp_</code>) и вставь:<br><input type="text" id="tk" placeholder="ghp_…" style="max-width:100%;margin:8px 0" autocomplete="off" spellcheck="false">'+
 '<label class="m" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rem"> запомнить на этом компьютере</label>'+
 '<p style="margin:12px 0 0"><button class="btn" id="in">Войти</button></p><p id="gm" class="'+(msg?'bad':'m')+'" style="margin-top:10px">'+esc(msg||"")+'</p></div>'+
 '<p class="m" style="font-size:14px">Токен без прав нужен, только чтобы GitHub подтвердил, что это ты. Он хранится в этом браузере и отправляется только на api.github.com. Заодно лимит запросов вырастает с 60 до 5000 в час.</p></div>';
 document.getElementById("in").onclick=function(){
  var tk=document.getElementById("tk").value.trim(),b=this;if(!tk){return}
  b.disabled=true;document.getElementById("gm").className="m";document.getElementById("gm").textContent="Проверяю…";
  api("/user",tk).then(function(r){if(!r.ok)throw new Error(r.status===401?"Токен не подошёл":"Ошибка GitHub "+r.status);return r.json()}).then(function(u){
   if(String(u.login).toLowerCase()!==OWNER.toLowerCase()){throw new Error("Этот аккаунт ("+u.login+") не владелец репозитория")}
   try{(document.getElementById("rem").checked?localStorage:sessionStorage).setItem("tk",tk);localStorage.setItem("teacher",u.login)}catch(e){}
   location.reload();
  }).catch(function(e){b.disabled=false;var g=document.getElementById("gm");g.className="bad";g.textContent=e.message||"Нет связи с GitHub"});
 };
}

function statusOf(x){var l=x.labels.map(function(a){return a.name});return l.indexOf("решено")>=0?"ok":(l.indexOf("ошибки")>=0?"bad":"wait")}
function build(issues){
 var by={},sub=[];
 issues.forEach(function(x){var s=sections(x.body),nick=(s["Ник"]||"?").trim(),tm=(s["Задание"]||"").match(/^(\d+\.\d+)/);if(!tm)return;
  var st=statusOf(x),k=nick.toLowerCase();by[k]=by[k]||{nick:nick,t:{},fails:{},last:""};
  if(st==="bad")by[k].fails[tm[1]]=(by[k].fails[tm[1]]||0)+1;
  var c=by[k].t[tm[1]];if(!c||st==="ok"||(c!=="ok"&&st!=="wait"))by[k].t[tm[1]]=st;
  if(x.updated_at>by[k].last)by[k].last=x.updated_at;
  sub.push({nick:nick,task:tm[1],st:st,url:x.html_url,date:x.updated_at,num:x.number})});
 return {by:by,sub:sub.sort(function(a,b){return b.date<a.date?-1:1})};
}
function nm(nick){var n=jget("names",{})[nick.toLowerCase()];return n?esc(n)+' <span class="m">('+esc(nick)+')</span>':esc(nick)}
function dl(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:type||"text/csv"}));a.download=name;a.click()}
function cabinet(st){
 app.innerHTML='<div class="crumbs">Кабинет учителя · вы вошли как '+esc(st.login)+' · <a href="#" id="out">выйти</a></div><h1>Кабинет</h1><div class="cab-tabs" id="tb"></div><div id="tab"><span class="m">Загружаю данные…</span></div>';
 document.getElementById("out").onclick=function(e){e.preventDefault();logout()};
 var tabs=[["sum","Сводка"],["sub","Заявки"],["stu","Ученики"],["quiz","Тест"],["lnk","Управление"]],cur="sum";
 function draw(){document.getElementById("tb").innerHTML=tabs.map(function(t){return '<button data-k="'+t[0]+'" class="'+(t[0]===cur?'on':'')+'">'+t[1]+'</button>'}).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#tb button"),function(b){b.onclick=function(){cur=b.dataset.k;draw();show()}});}
 function show(){var el=document.getElementById("tab");if(!DATA&&cur!=="quiz"&&cur!=="lnk"){el.innerHTML='<span class="m">Загружаю данные…</span>';return}({sum:tSum,sub:tSub,stu:tStu,quiz:tQuiz,lnk:tLnk})[cur](el)}
 draw();
 fetchIssues("сдача",function(a){DATA=build(a);show()},function(e){document.getElementById("tab").innerHTML='<div class="box bad">Не загрузилось ('+esc(e.message)+'). '+(e.message==="401"?'Токен устарел — <a href="#" id="o2">войти заново</a>.':'Проверь связь с GitHub.')+'</div>';var o=document.getElementById("o2");if(o)o.onclick=function(ev){ev.preventDefault();logout()}});
}
function tSum(el){
 var ns=Object.keys(DATA.by).sort(),solved=0,wait=0,stuck=[];
 ns.forEach(function(k){var u=DATA.by[k];TASKS.forEach(function(t){if(u.t[t.id]==="ok")solved++;if(u.t[t.id]==="wait")wait++;if(u.fails[t.id]>=3&&u.t[t.id]!=="ok")stuck.push(u.nick+" — "+t.id)})});
 var h='<div class="kpis"><div class="kpi"><b>'+ns.length+'</b><span>учеников (ников)</span></div><div class="kpi"><b>'+DATA.sub.length+'</b><span>заявок</span></div><div class="kpi"><b>'+solved+'</b><span>решённых заданий</span></div><div class="kpi"><b class="'+(stuck.length?'stuck':'')+'">'+stuck.length+'</b><span>застряли (3+ попыток)</span></div></div>';
 if(stuck.length)h+='<div class="callout warn" style="background:color-mix(in srgb,var(--amber) 9%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0"><b>Нужна помощь:</b> '+stuck.map(esc).join(", ")+'</div>';
 if(!ns.length){el.innerHTML=h+'<div class="box">Пока нет сдач.</div>';return}
 h+='<div class="box" style="overflow:auto"><table class="matrix"><tr><th>Ученик</th>'+TASKS.map(function(t){return '<th title="'+esc(t.title)+'">'+t.id+'</th>'}).join("")+'<th>Итого</th></tr>';
 ns.forEach(function(k){var u=DATA.by[k],c=0;h+='<tr><td>'+nm(u.nick)+'</td>'+TASKS.map(function(t){var v=u.t[t.id];if(v==="ok")c++;return '<td>'+(v==="ok"?'<span class="ok">●</span>':v==="bad"?'<span class="bad">●</span>':v==="wait"?'<span class="m">○</span>':'')+'</td>'}).join("")+'<td><b>'+c+'</b>/'+TASKS.length+'</td></tr>'});
 h+='</table></div><p class="m" style="font-size:14px"><span class="ok">●</span> решено &nbsp; <span class="bad">●</span> ошибки &nbsp; <span>○</span> ждёт проверки</p><button class="btn ghost" id="csv">Скачать CSV</button>';
 el.innerHTML=h;
 document.getElementById("csv").onclick=function(){var names=jget("names",{});dl("journal.csv","ученик;ник;"+TASKS.map(function(t){return t.id}).join(";")+";решено\n"+ns.map(function(k){var u=DATA.by[k],c=0;return [(names[k]||""),u.nick].concat(TASKS.map(function(t){var v=u.t[t.id];if(v==="ok")c++;return v==="ok"?1:(v==="bad"?0:"")})).concat([c]).join(";")}).join("\n"))};
}
function tSub(el){
 var em={ok:["решено","chip done"],bad:["ошибки","chip"],wait:["ждёт","chip"]};
 el.innerHTML='<div class="box"><table><tr><th>Ученик</th><th>Задание</th><th>Статус</th><th>Обновлено</th><th></th></tr>'+DATA.sub.slice(0,80).map(function(s){return '<tr><td>'+nm(s.nick)+'</td><td>'+s.task+'</td><td><span class="'+em[s.st][1]+'">'+em[s.st][0]+'</span></td><td class="m">'+new Date(s.date).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+'</td><td><a href="'+esc(s.url)+'" target="_blank" rel="noopener">открыть</a></td></tr>'}).join("")+'</table></div>';
}
function tStu(el){
 var names=jget("names",{}),ks=Object.keys(DATA.by);Object.keys(names).forEach(function(k){if(ks.indexOf(k)<0)ks.push(k)});ks.sort();
 el.innerHTML='<p class="m">Здесь ты сопоставляешь ники с реальными именами. Это хранится <b style="color:var(--text)">только в этом браузере</b>, на GitHub и на сайт ничего не уходит. Сделай выгрузку, чтобы не потерять.</p>'+
 '<div class="box"><table><tr><th>Ник</th><th>Фамилия Имя, класс</th></tr>'+ks.map(function(k){return '<tr><td>'+esc(DATA.by[k]?DATA.by[k].nick:k)+'</td><td><input type="text" data-k="'+esc(k)+'" value="'+esc(names[k]||"")+'" style="max-width:100%" aria-label="Имя для '+esc(k)+'"></td></tr>'}).join("")+'</table>'+
 '<div class="btns"><button class="btn" id="sv">Сохранить</button><button class="btn ghost" id="ex">Выгрузить файл</button><label class="btn ghost" style="cursor:pointer">Загрузить файл<input type="file" id="im" accept=".json" hidden></label></div><span id="sm" class="ok"></span></div>';
 document.getElementById("sv").onclick=function(){var o={};Array.prototype.forEach.call(el.querySelectorAll("input[data-k]"),function(i){if(i.value.trim())o[i.dataset.k]=i.value.trim()});try{localStorage.setItem("names",JSON.stringify(o))}catch(e){}document.getElementById("sm").textContent="Сохранено"};
 document.getElementById("ex").onclick=function(){dl("ученики.json",JSON.stringify(jget("names",{}),null,1),"application/json")};
 document.getElementById("im").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(String(r.result).replace(/^﻿/,""));localStorage.setItem("names",JSON.stringify(o));tStu(el)}catch(e){alert("Не получилось прочитать файл")}};r.readAsText(f)};
}
function tQuiz(el){
 el.innerHTML='<p class="m">Вставь коды результатов теста, по одному в строке.</p><textarea class="code" id="qi" style="min-height:120px;border-radius:10px;width:100%" placeholder="Код 1&#10;Код 2"></textarea><div class="btns"><button class="btn" id="qg">Разобрать</button><button class="btn ghost" id="qc">Скачать CSV</button></div><div id="qo"></div>';
 var rows=[];
 function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}
 document.getElementById("qg").onclick=function(){rows=[];var bad=0,stat={};
  document.getElementById("qi").value.split(/\n+/).forEach(function(l){if(!l.trim())return;try{var o=dec(l),s=0;o.a.forEach(function(a){var q=QUESTIONS[a[0]];if(!q)return;stat[a[0]]=stat[a[0]]||[0,0];stat[a[0]][1]++;if(q.a==a[1]){s++;stat[a[0]][0]++}});rows.push({n:o.n,l:o.l,d:o.d,s:s,t:o.a.length})}catch(e){bad++}});
  rows.sort(function(a,b){return b.s/b.t-a.s/a.t});
  var h='<div class="box"><table><tr><th>#</th><th>Ученик</th><th>Тест</th><th>Баллы</th><th>%</th></tr>'+rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+nm(r.n)+'</td><td>'+(r.l?'урок '+r.l:'весь курс')+'</td><td>'+r.s+' / '+r.t+'</td><td>'+Math.round(r.s/r.t*100)+'</td></tr>'}).join("")+'</table>'+(bad?'<p class="bad">Не прочитано кодов: '+bad+'</p>':'')+'</div>';
  var ids=Object.keys(stat).sort(function(a,b){return stat[a][0]/stat[a][1]-stat[b][0]/stat[b][1]});
  h+='<div class="box"><b>Самые трудные вопросы</b><table>'+ids.slice(0,6).map(function(i){return '<tr><td>'+stat[i][0]+' / '+stat[i][1]+'</td><td>урок '+QUESTIONS[i].l+': '+esc(QUESTIONS[i].q)+(QUESTIONS[i].code?'<pre>'+esc(QUESTIONS[i].code)+'</pre>':'')+'</td></tr>'}).join("")+'</table></div>';
  document.getElementById("qo").innerHTML=h};
 document.getElementById("qc").onclick=function(){dl("quiz.csv","имя;тест;баллы;всего;процент\n"+rows.map(function(r){return [r.n,r.l||"все",r.s,r.t,Math.round(r.s/r.t*100)].join(";")}).join("\n"))};
}
function tLnk(el){
 var L=[["/issues?q=label%3A%D1%81%D0%B4%D0%B0%D1%87%D0%B0","Все заявки","Issues с меткой «сдача»"],["/actions","Проверки","Вкладка Actions: запуски робота"],["/settings/pages","Настройки сайта","Settings → Pages"],["/blob/main/docs/data/theory.js","Плашки теории","открыть файл, карандаш — править"],["/tree/main/lessons","Задания","папка lessons"],["/blob/main/CONTRIBUTING.md","Как добавить задание","инструкция"],["/blob/main/%D0%98%D0%9D%D0%A1%D0%A2%D0%A0%D0%A3%D0%9A%D0%A6%D0%98%D0%AF_%D0%A3%D0%A7%D0%98%D0%A2%D0%95%D0%9B%D0%AE.md","Инструкция учителю","что где лежит"],["/issues/new?template=project.yml","Новый проект","форма «Показать проект»"]];
 el.innerHTML='<div class="linkgrid">'+L.map(function(x){return '<a href="'+ghUrl(x[0])+'" target="_blank" rel="noopener"><b>'+x[1]+'</b><span>'+x[2]+'</span></a>'}).join("")+'</div>';
}
var st=ST();
if(st.tk&&st.login&&st.login.toLowerCase()===OWNER.toLowerCase()){
 api("/user",st.tk).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(u){if(String(u.login).toLowerCase()!==OWNER.toLowerCase())throw 0;cabinet(st)}).catch(function(){try{sessionStorage.removeItem("tk");localStorage.removeItem("tk");localStorage.removeItem("teacher")}catch(e){}gate("Сессия закончилась. Войди снова.")});
}else gate();
</script></body></html>
