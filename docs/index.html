<script src="site.js"></script><script src="data/tasks.js"></script>
<script>
layout("index.html");
var CHK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
function load(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}}}
var sent=load("done"),passed=load("passed");
var L={},ls=[];TASKS.forEach(function(t){if(!L[t.lesson]){L[t.lesson]={t:t.lessonTitle,a:[]};ls.push(t.lesson)}L[t.lesson].a.push(t)});
var nextT=TASKS.filter(function(t){return !sent[t.id]&&!passed[t.id]})[0]||null;
var cont=document.getElementById("cont");
if(nextT){cont.textContent=(Object.keys(sent).length||Object.keys(passed).length?"Продолжить: ":"Начать: ")+nextT.id+" "+nextT.title;cont.href="task.html?id="+nextT.id}
document.getElementById("how").onclick=function(){window.openGuide&&window.openGuide(0)};
document.getElementById("list").innerHTML=ls.map(function(n){var l=L[n],c=l.a.filter(function(t){return sent[t.id]}).length,R=18,C=2*Math.PI*R,off=C*(1-c/l.a.length);
 var nodes=l.a.map(function(t,i){var cls=sent[t.id]?"sent":(passed[t.id]?"passed":(nextT&&nextT.id===t.id?"next":""));
  return (i?'<span class="ln'+(sent[l.a[i-1].id]?' done':'')+'"></span>':'')+'<a class="node '+cls+'" href="task.html?id='+t.id+'" data-t="'+esc(t.title)+'" aria-label="'+t.id+' '+esc(t.title)+'">'+(sent[t.id]?CHK:t.id)+'</a>'}).join("");
 return '<section class="track"><div class="head">'+lessonIcon(n)+'<div><h3>Урок '+n+'</h3><div class="sub">'+esc(l.t)+'</div></div><svg class="ring" viewBox="0 0 44 44" aria-label="'+c+' из '+l.a.length+'" style="margin-left:auto"><circle class="bg" cx="22" cy="22" r="'+R+'"/><circle class="fg" cx="22" cy="22" r="'+R+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg></div><div class="path">'+nodes+'</div></section>'}).join("");
try{if(!localStorage.getItem("seenStart")){window.__guideAuto=true;if(window.openGuide)window.openGuide(0)}}catch(e){}
</script></body></html>
