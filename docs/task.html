<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com https://course.2-27-53-182.sslip.io wss://course.2-27-53-182.sslip.io; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'"><meta name="referrer" content="no-referrer"><title>Задание</title><link rel="preload" href="fonts/press-start-2p-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/ibm-plex-mono-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="explainer.css"><link rel="stylesheet" href="games.css"></head><body>
<main class="wrap" id="main"></main>
<script src="site.js"></script><script src="config.js"></script><script src="net.js"></script><script src="honest.js"></script><script src="offline.js"></script><script src="data/tasks.js"></script><script src="data/theory.js"></script><script src="runner/check.js"></script><script src="data/clips.js"></script><script src="explainer.js"></script><script src="hints.js"></script><script src="games.js"></script><script src="reward.js"></script>
<script>
(function(){
layout("tasks.html","Задание");
var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var OKI='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
var BADI='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function load(k){try{var v=JSON.parse(localStorage.getItem(k)||"{}");return v&&typeof v==="object"?v:{}}catch(e){return {}}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var id=new URLSearchParams(location.search).get("id"),t=TASKS.filter(function(x){return x.id===id})[0],m=document.querySelector("#main .in");
if(!t){m.innerHTML='<h1 style="margin-top:40px">Задание не найдено</h1><p><a href="tasks.html">← к заданиям</a></p>'}else{
document.title=t.id+" "+t.title+" · Python-курс";
var i=TASKS.indexOf(t),prev=TASKS[i-1],next=TASKS[i+1];
var ex="";if(t.example){ex=t.func?'<div class="io" style="grid-template-columns:1fr"><div class="term"><header>пример вызова</header><pre>&gt;&gt;&gt; '+esc(t.example.in)+'\n'+esc(t.example.out)+'</pre></div></div>':
 '<div class="io"><div class="term"><header>ввод</header><pre>'+esc(t.example.in)+'</pre></div><div class="arrow">'+ARROW+'</div><div class="term"><header>вывод</header><pre>'+esc(t.example.out)+'</pre></div></div>'}
var nick="",grp="",fio="";try{fio=localStorage.getItem("fio")||"";nick=localStorage.getItem("nick")||"";grp=localStorage.getItem("group")||""}catch(e){}
var tc=Explainer.forTask(t.id),lc=Explainer.forLesson(t.lesson),vidBox="";
if(tc||lc.length)vidBox='<div class="plate" style="background:var(--cream)"><h3>Видеоразбор</h3>'+(tc?'<p>Смотри, как это задание решают и сдают.</p><button class="btn sm go" type="button" data-clip="'+tc.id+'">Смотреть задание</button>':"")+lc.map(function(c){return '<p style="margin:8px 0 0"><button class="btn sm ghost" type="button" data-clip="'+c.id+'">'+esc(c.title)+'</button></p>'}).join("")+'</div>';
var ids=THEORY_MAP[t.id],pl=ids?ids.map(function(k){return THEORY.filter(function(p){return p.id===k})[0]}).filter(Boolean):THEORY.filter(function(p){return p.l===t.lesson});
m.innerHTML='<div class="crumbs"><a href="tasks.html">← Все задания</a></div><div class="task-grid"><div>'+
'<div class="tk-head">'+lessonIcon(t.lesson)+'<div><div class="m" style="font-size:14px">Урок '+t.lesson+' · '+esc(t.lessonTitle)+'</div><h1 style="margin:0;font-size:clamp(15px,2.4vw,20px);line-height:1.5">'+t.id+' '+esc(t.title)+'</h1></div></div>'+
'<div class="stepper" id="stp"><div class="st on" id="s1"><i>1</i>Код</div><span class="ln"></span><div class="st" id="s2"><i>2</i>Проверка</div><span class="ln"></span><div class="st" id="s3"><i>3</i>Отправка</div></div>'+
'<p class="cond">'+md(t.text)+'</p>'+ex+
'<div class="toolbar"><button class="btn sm ghost" id="hintB">Подсказка</button></div><div class="box" id="hint" style="display:none;margin-top:8px"><p>'+md(t.hint||"")+'</p></div>'+
'<div class="editor" style="margin-top:16px"><div class="bar2"><i></i><i></i><i></i><span>'+esc(t.file)+'</span></div><textarea id="code" autocomplete="off" spellcheck="false" aria-label="Код решения"></textarea></div><div class="m" id="hn" role="status" style="font-size:14px;min-height:1.4em">Код набирай сам: вставка отключена. Так он лучше запоминается.</div>'+
'<div class="toolbar"><button class="btn big go" id="chk">Проверить здесь</button><span class="sp"></span><button class="btn sm ghost" id="cp">Копировать</button><button class="btn sm ghost" id="dl">Скачать .py</button><button class="btn sm ghost" id="rs">Сбросить</button></div>'+
'<div class="res" id="res"></div><div id="next"></div>'+
'<div class="sendbox" id="send"><input type="text" id="nick" maxlength="30" placeholder="твой ник" value="'+esc(nick)+'" aria-label="Ник (не фамилия)"><input type="text" id="group" maxlength="12" placeholder="группа (9А)" value="'+esc(grp)+'" aria-label="Номер группы, например 9А. Нет группы: нет"><button class="btn alt go" id="go">Отправить учителю</button><button class="q" id="q" title="Как это работает" aria-label="Как отправить">?</button><span id="msg" class="m" style="font-size:14px"></span></div>'+
'<details class="box" id="off" style="margin-top:12px"><summary>Нет GitHub? Отправь без него</summary><p class="m">Получи код сдачи и отправь его учителю как удобно: в мессенджер, на почту, в школьную систему или файлом. Код получит только учитель, поэтому здесь можно написать фамилию и имя.</p><div class="sendbox" style="margin-top:8px"><input type="text" id="fio" maxlength="40" placeholder="Фамилия Имя" aria-label="Фамилия и имя" value="'+esc(fio)+'"><button class="btn alt" id="mk">Получить код сдачи</button></div><div id="offo" hidden><textarea id="tok" readonly rows="4" style="width:100%;margin-top:10px" aria-label="Код сдачи"></textarea><div class="toolbar"><button class="btn sm" id="tcp">Копировать код</button><button class="btn sm ghost" id="tdl">Скачать файл</button></div><p class="m" id="tmsg" role="status" style="font-size:14px"></p></div></details>'+
'<div class="pager"><span>'+(prev?'<a class="btn ghost" href="task.html?id='+prev.id+'">← '+prev.id+'</a>':'')+'</span><span>'+(next?'<a class="btn ghost" href="task.html?id='+next.id+'">'+next.id+' →</a>':'')+'</span></div></div>'+
'<aside class="aside">'+vidBox+'<h2>Шпаргалка</h2>'+pl.map(plate).join("")+'<p class="m" style="font-size:14px"><a href="theory.html?l='+t.lesson+'">Вся теория урока →</a></p></aside></div>';
Explainer.bind(m);
(function(){
var sk="brief_"+t.id,brEl=null;
function open(){
 if(brEl)return;
 var sm=t.sample?'<div class="sm-ex"><div class="lab">ПОХОЖИЙ ПРИМЕР (не твоё задание)</div><p style="margin:8px 0 0">'+md(t.sample.task)+'</p><pre>'+esc(t.sample.code)+'</pre><pre style="color:var(--title)">'+esc(t.sample.out)+'</pre></div>':"";
 var st=t.steps&&t.steps.length?'<div><div class="lab" style="margin-bottom:8px">КАК ДЕЛАТЬ</div><ol>'+t.steps.map(function(x){return '<li>'+md(x)+'</li>'}).join("")+'</ol></div>':"";
 brEl=document.createElement("div");brEl.className="brief";brEl.setAttribute("role","dialog");brEl.setAttribute("aria-modal","true");brEl.setAttribute("aria-label","Задание "+t.id);
 brEl.innerHTML='<div class="win"><div class="tb">ЗАДАНИЕ '+t.id+'</div><div class="bd"><h2>'+esc(t.title)+'</h2><p class="cond">'+md(t.text)+'</p>'+ex+sm+st+'<div class="toolbar"><button class="btn big go" type="button" id="brGo">Понятно, начать</button></div></div></div>';
 document.body.appendChild(brEl);document.body.style.overflow="hidden";
 function close(){try{sessionStorage.setItem(sk,"1")}catch(e){}document.body.style.overflow="";brEl.remove();brEl=null;document.removeEventListener("keydown",esc2);try{ta.focus()}catch(e){}}
 function esc2(e){if(e.key==="Escape")close()}
 document.addEventListener("keydown",esc2);
 brEl.querySelector("#brGo").onclick=close;brEl.querySelector("#brGo").focus();
}
var tb=m.querySelector(".cond");
if(tb){var b=document.createElement("button");b.type="button";b.className="btn sm ghost";b.textContent="Открыть задание полностью";b.style.marginTop="8px";b.onclick=open;tb.insertAdjacentElement("afterend",b)}
var seen="";try{seen=sessionStorage.getItem(sk)}catch(e){}
if(!seen&&!window.__noBrief)open();
})();
var ta=document.getElementById("code"),key="code_"+t.id,saved=null;
try{saved=localStorage.getItem(key)}catch(e){}
ta.value=saved!==null?saved:t.starter;
Honest.attach(ta,{id:t.id,starter:t.starter,onBlock:function(k){var h=document.getElementById("hn");h.className="bad";if(k==="bot"){h.textContent="Ай-ай-ай! Похоже, код вводит бот. Редактор заблокирован, учитель получит отметку. Если это ошибка, напиши учителю.";h.style.cssText="background:#c01a2f;color:#fff;font-weight:700;padding:12px 14px;border:3px solid #000;font-size:16px";var cb=document.getElementById("chk");if(cb)cb.disabled=true;return}h.textContent=k==="size"?"Слишком длинный код. Решение этой задачи намного короче: удали лишнее.":k==="bulk"?"Слишком много текста за раз. Набирай код сам, по частям.":k==="script"?"Код нельзя подставить скриптом. Набери его сам.":"Вставка отключена. Набери код сам: так ты его запомнишь."}});
function step(n,ok){["s1","s2","s3"].forEach(function(s,k){var e=document.getElementById(s);e.className="st"+(k<n?" ok":(k===n?" on":""));e.firstChild.innerHTML=k<n?OKI:(k+1)});}
function refreshSteps(){var d=load("done"),p=load("passed");step(d[t.id]?3:(p[t.id]?2:0));document.getElementById("send").className="sendbox"+(p[t.id]&&!d[t.id]?" ready":"")}
refreshSteps();if(load("passed")[t.id])Reward.show(document.getElementById("next"),t);
ta.oninput=function(){try{localStorage.setItem(key,ta.value)}catch(e){}};
document.getElementById("hintB").onclick=function(){var h=document.getElementById("hint");h.style.display=h.style.display==="none"?"block":"none"};
document.getElementById("cp").onclick=function(){copyText(Honest.code(ta),this)};
document.getElementById("rs").onclick=function(){if(confirm("Вернуть заготовку? Твой код пропадёт.")){Honest.restart(ta);ta.oninput()}};
document.getElementById("dl").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+Honest.code(ta)],{type:"text/x-python"}));a.download=t.file;a.click()};
document.getElementById("q").onclick=function(){window.openGuide&&window.openGuide(3)};
var warmed=false;function warmOnce(){if(!warmed){warmed=true;var c=navigator.connection;if(c&&c.saveData)return;BrowserCheck.warm()}}
ta.addEventListener('focus',warmOnce,{once:true});ta.addEventListener('input',warmOnce,{once:true});
var res=document.getElementById("res"),chk=document.getElementById("chk");
chk.onclick=function(){if(Honest.locked(ta)){var hh=document.getElementById("hn");hh.className="bad";hh.textContent="Редактор заблокирован: похоже, код вводит бот.";return}
 res.className="res on wait";res.innerHTML='<div class="rh">'+(BrowserCheck.isReady()?'Проверяю…':'Первый запуск: загружаю проверку (около 13 МБ, один раз). Подожди…')+'</div>';chk.disabled=true;
 BrowserCheck.run(t,Honest.code(ta)).then(function(r){chk.disabled=false;
  if(r.todo){res.className="res on fail";res.innerHTML='<div class="rh">'+BADI+'Пока тут только заготовка. Напиши решение.</div>';return}
  if(r.ok){res.className="res on pass";res.innerHTML='<div class="rh">'+OKI+'Все тесты пройдены. Отправь решение учителю</div>';var p=load("passed");p[t.id]=1;save("passed",p);Net.push();refreshSteps();Streak.touch();Reward.show(document.getElementById("next"),t);document.getElementById("go").focus()}
  else{res.className="res on fail";res.innerHTML='<div class="rh">'+BADI+'Пока не так</div><ul>'+r.messages.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ul>'+(r.sample?'<pre>'+esc(r.sample.slice(0,400))+'</pre>':"")+Hints.html(Hints.explain(Honest.code(ta),t,r))}
 });
};
document.getElementById("go").onclick=function(){if(Honest.locked(ta)){var hh=document.getElementById("hn");hh.className="bad";hh.textContent="Редактор заблокирован: похоже, код вводит бот.";return}
 var n=document.getElementById("nick").value.trim(),g=document.getElementById("group").value.trim(),msg=document.getElementById("msg");
 if(!n){msg.className="bad";msg.textContent="Впиши ник (не фамилию).";return}
 if(!g){msg.className="bad";msg.textContent="Впиши номер группы, например 9А. Нет группы: напиши «нет».";document.getElementById("group").focus();return}
 try{localStorage.setItem("nick",n);localStorage.setItem("group",g)}catch(e){}
 var base="/issues/new?template=submit.yml&title="+encodeURIComponent("[Сдача] "+t.id+" "+n)+"&nick="+encodeURIComponent(n)+"&group="+encodeURIComponent(g)+"&task="+encodeURIComponent(t.id+" — "+t.title)+"&meta="+encodeURIComponent(Honest.meta(ta));
 var url=ghUrl(base+"&code="+encodeURIComponent(Honest.code(ta)));
 if(url.length>7500){msg.className="warn";msg.textContent="Код длинный: нажми «Копировать» и вставь его на GitHub.";url=ghUrl(base)}
 else{msg.className="ok";msg.textContent="Открываю GitHub → нажми Submit new issue"}
 var d=load("done");d[t.id]=1;save("done",d);Net.push();refreshSteps();
 window.open(url,"_blank","noopener");
};
document.getElementById("mk").onclick=function(){if(Honest.locked(ta)){var hh=document.getElementById("hn");hh.className="bad";hh.textContent="Редактор заблокирован: похоже, код вводит бот.";return}
 var f=document.getElementById("fio").value.trim(),g=document.getElementById("group").value.trim(),tm=document.getElementById("tmsg"),o=document.getElementById("offo");
 o.hidden=false;
 if(!f){tm.className="bad";tm.textContent="Впиши фамилию и имя.";document.getElementById("tok").value="";return}
 if(!g){tm.className="bad";tm.textContent="Впиши группу в поле выше (например 9А). Нет группы: напиши «нет».";document.getElementById("tok").value="";document.getElementById("group").focus();return}
 try{localStorage.setItem("fio",f);localStorage.setItem("group",g)}catch(e){}
 var p=load("passed"),tok=Offline.pack({n:f,g:g,t:t.id,c:Honest.code(ta),m:Honest.meta(ta),ok:!!p[t.id]});
 document.getElementById("tok").value=tok;tm.className="ok";tm.textContent=p[t.id]?"Готово. Отправь этот код учителю.":"Готово. Но код пока не прошёл проверку здесь. Нажми «Проверить здесь» или отправь как есть: учитель проверит сам.";
 var d=load("done");d[t.id]=1;save("done",d);Net.push();refreshSteps();
};
document.getElementById("tcp").onclick=function(){copyText(document.getElementById("tok").value,this)};
document.getElementById("tdl").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([document.getElementById("tok").value+"\n"],{type:"text/plain"}));a.download="сдача_"+t.id+".txt";a.click()};
}
})();
</script></body></html>
