<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'"><meta name="referrer" content="no-referrer"><title>Облако слов</title><link rel="stylesheet" href="site.css"></head><body>
<main class="wrap">
<div class="crumbs">Облако слов</div><h1>Облако слов</h1>
<p class="m">Пока это заготовка: слова вводятся тут же и никуда не сохраняются. Откуда брать слова и где показывать, решим позже.</p>
<div class="btns"><input id="w" maxlength="24" placeholder="Слово по теме" aria-label="Слово по теме"> <button class="btn" id="add">Добавить</button> <button class="btn" id="clr">Очистить</button></div>
<div id="cloud" class="box"></div>
</main>
<script src="site.js"></script><script src="cloud.js"></script>
<script>
layout("cloud.html","Облако слов");
var words=["python","цикл","переменная","функция","цикл","список","python","if"];
function draw(){var n=WordCloud.render(document.getElementById("cloud"),words);if(!n)document.getElementById("cloud").textContent="Пока пусто. Добавь первое слово."}
document.getElementById("add").onclick=function(){var i=document.getElementById("w");if(i.value.trim()){words.push(i.value);i.value="";draw()}};
document.getElementById("w").onkeydown=function(e){if(e.key==="Enter")document.getElementById("add").click()};
document.getElementById("clr").onclick=function(){words=[];draw()};
draw();
</script></body></html>
