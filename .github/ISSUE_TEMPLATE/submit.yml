name: "Сдать задание"
description: Отправь решение — робот проверит его за минуту и ответит в комментарии
title: "[Сдача] "
labels: ["сдача"]
body:
  - type: markdown
    attributes:
      value: |
        Робот запустит твой код на тестах и напишет результат в комментарии. Если есть ошибки — исправь код, нажми «Edit» у этого Issue, и проверка запустится снова.
        **Не пиши фамилию и имя: Issue виден всем.** Придумай ник и скажи его учителю. Твой GitHub-аккаунт и группа попадут в приватную ведомость учителя.
  - type: input
    id: nick
    attributes:
      label: Ник
      description: Твой псевдоним (например, snake_42)
    validations:
      required: true
  - type: input
    id: group
    attributes:
      label: Группа
      description: Номер группы, например 9А. Нет группы? Напиши «нет»
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Задание
      options:
        - "1.1 — Визитка"
        - "1.2 — Площадь прямоугольника"
        - "1.3 — Километры в метры"
        - "1.4 — Минуты в часы"
        - "2.1 — Светофор"
        - "2.2 — Оценка по баллам"
        - "2.3 — Аттракцион"
        - "2.4 — Городской помощник 1.0"
        - "3.1 — Таблица умножения"
        - "3.2 — Сумма до n"
        - "3.3 — Чек в магазине"
        - "3.4 — Функция recommend"
        - "3.5 — Наибольшее в списке"
        - "4.1 — Сколько слов"
        - "4.2 — Палиндром"
        - "4.3 — Счётчик букв"
        - "4.4 — Переводчик"
        - "4.5 — Приветствие в файле"
        - "5.1 — Безопасный int"
        - "5.2 — Безопасное деление"
        - "5.3 — Ввод числа с повтором"
        - "5.4 — Городской помощник 3.0"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Код решения
      description: Код подставляется с сайта сам. Не меняй его здесь
      render: python
    validations:
      required: true
  - type: input
    id: meta
    attributes:
      label: Служебное (не меняй)
      description: Заполняется сайтом. По нему учитель видит, что код набран самим, а не вставлен
