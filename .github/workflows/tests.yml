name: Тесты
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Песочница проверки (атаки и лимиты)
        run: python -m unittest tests.test_sandbox -v
      - name: Браузерные тесты (дымовые, функциональные, безопасность)
        run: |
          pip install playwright aiohttp
          playwright install --with-deps chromium
          python tests/browser_tests.py smoke functional teacher slides honest offline video extras brief chaos online botguard unlock
